name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore configured, the APKs are signed with a temporary key"
          fi

      - name: Test and build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest packageReleaseApks -PversionName="${TAG#v}"

      - name: Verify APK signatures
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in app/build/dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | head -3
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Write release notes
        run: |
          version="${TAG#v}"
          notes=release-notes.md
          # the changelog section of this version, if there is one
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changes.md || true
          {
            echo "## Install"
            echo
            echo "Most Android TV devices need **AirPlayTV-v${version}-arm64.apk**."
            echo "Use \`armv7\` for older 32-bit TVs, \`x86_64\` for emulators, or \`universal\` if unsure."
            echo
            echo '```'
            echo "adb install AirPlayTV-v${version}-arm64.apk"
            echo '```'
            echo
            echo "Already installed? On the TV: **Advanced → Software Update**."
            echo
            if [ -s changes.md ]; then
              echo "## Changes"
              cat changes.md
              echo
            fi
            echo "## SHA-256"
            echo
            echo '```'
            cat app/build/dist/SHA256SUMS
            echo '```'
          } > "$notes"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3-rc.1 and the like are test versions: only a TV running a test version offers them
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" app/build/dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md --prerelease="$prerelease"
          else
            gh release create "$TAG" app/build/dist/* \
              --title "AirPlay TV ${TAG#v}" \
              --notes-file release-notes.md \
              --prerelease="$prerelease"
          fi
